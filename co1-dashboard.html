<html lang="en"><head><meta charset="utf-8"><title>BI Module 1: Theory and Simulation Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#FAF7F0;--card:#fff;--ink:#222;--mut:#5A6070;--navy:#1F2A44;--gold:#B8932A;--tint:#EFE8D6;--good:#2e7d32;--bad:#b3261e;--line:#d9d2c0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1c2130;--ink:#ecebe6;--mut:#a3a8b5;--navy:#c9d3f2;--gold:#d4ae48;--tint:#2a2a22;--good:#66bb6a;--bad:#ef7b72;--line:#343b50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1c2130;--ink:#ecebe6;--mut:#a3a8b5;--navy:#c9d3f2;--gold:#d4ae48;--tint:#2a2a22;--good:#66bb6a;--bad:#ef7b72;--line:#343b50;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Calibri,"Segoe UI",system-ui,sans-serif}
header{padding:20px 20px 8px;max-width:1100px;margin:auto}
h1{font:700 24px Georgia,serif;color:var(--navy);margin:0}
h2{font:700 17px Georgia,serif;color:var(--navy);margin:0 0 8px}
.sub{color:var(--mut);margin:4px 0 0}
.bar{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
#score{background:var(--tint);border:1px solid var(--gold);border-radius:8px;padding:4px 10px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 20px;max-width:1100px;margin:auto;border-bottom:2px solid var(--gold)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.mut{color:var(--mut)}
.app{background:var(--tint);border-left:4px solid var(--gold);padding:8px 10px;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--line);padding:5px 7px;text-align:left}th{background:var(--tint)}
.q{border-top:1px solid var(--line);padding:10px 0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button,.rs{border:1px solid var(--navy);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:6px;font:inherit;cursor:pointer}

label{display:block;margin:8px 0 0;font-weight:600}
input[type=range]{width:100%}

.k{background:var(--tint);border:1px solid var(--gold);border-radius:8px;padding:8px;text-align:center}

<header><h1>Module 1: From Data to Decisions</h1>
<p class="sub">Business Intelligence &amp; Data Visualisation (26MB5210E) · theory and simulation tutorials</p>
<div class="id"><label>Student name<input id="sn" type="text" autocomplete="name" placeholder="Your full name"></label><label>Student ID number<input id="si" type="text" placeholder="e.g. 2400012345"></label></div>
<div class="bar"><span id="score"></span></div></header>
<nav id="nav"></nav><main id="panel"></main>
<script>
const $=s=>document.querySelector(s);
const tabs=[
{n:"1 · BI & decisions",ti:"DIKW sorter",pr:"Choose one statement from the sorter. In 3 to 4 sentences, explain how it moves from data to information to insight to action, and who would act on it.",how:"Classify each statement as data, information, insight or action.",
th:`<p><b>BI</b> turns data into information people can act on, so the right person decides better and on time. Value appears only when a decision changes.</p><ul><li><b>Data</b>: raw facts (a till record)</li><li><b>Information</b>: data with context (sales up 22%)</li><li><b>Insight</b>: the reason (match days)</li><li><b>Action</b>: the decision (stock more snacks)</li></ul><p><b>Four purposes:</b> visibility, control, learning, foresight.</p><p class="app"><b>In practice:</b> Walmart stocks ahead of storms using sales and weather data; Netflix chooses which title each member sees first; banks spot missed EMIs early; Swiggy and Zomato place riders ahead of demand.</p>`,
o:["Data","Information","Insight","Action"],
qs:[["Order #8821 was delivered at 19:42.",0,"A single raw record with no context."],["Average delivery time rose from 31 to 38 minutes this week.",1,"Data summarised and compared with context."],["Delivery time rises when rain slows riders in two zones.",2,"It explains why, so it is an insight."],["Add riders in those two zones when rain is forecast.",3,"A decision that changes what the business does."],["Store 112 sold 1,840 units last week, up 22%.",1,"A summarised, contextualised figure."]]},
{n:"2 · Analytics types",ti:"Classify the question",pr:"Pick one question you classified. Explain why it belongs to that analytics type and what a manager could do with the answer.",how:"Decide which analytics type each question needs.",
th:`<table><tr><th>Type</th><th>Question</th><th>Output</th></tr><tr><td>Descriptive</td><td>What happened?</td><td>Reports, KPIs</td></tr><tr><td>Diagnostic</td><td>Why?</td><td>Drill-down, driver trees</td></tr><tr><td>Predictive</td><td>What is likely?</td><td>Forecasts, risk scores</td></tr><tr><td>Prescriptive</td><td>What should we do?</td><td>Optimised actions</td></tr></table><p>Example: revenue fell 10.2% (descriptive); a ₹99 app promotion shifted the mix to small baskets (diagnostic); a churn model scores customer B at 71% (predictive); UPS-style routing picks the best route plan (prescriptive).</p><p class="app"><b>In practice:</b> Reliance Retail sales reviews, Zara sell-out analysis, telecom churn models, airline dynamic pricing.</p>`,
o:["Descriptive","Diagnostic","Predictive","Prescriptive"],
qs:[["How many credit-card applications did we receive last quarter?",0,"A count of past events."],["Why did approvals drop in the southern region?",1,"It asks for causes."],["How many applications will we receive in the festive quarter?",2,"It estimates a future value."],["How should we split the marketing budget across cities to maximise approvals?",3,"It asks for the best action under constraints."],["Which branch has the highest loan-default rate?",0,"A ranking of past results."],["Which open customers are most likely to leave next month?",2,"A probability about the future."]]},
{n:"3 · Value chain",ti:"Where did the chain break?",pr:"Describe one stage where the value chain can break. Give an example and explain how it would damage the final decision.",how:"Each scenario describes a failure. Pick the stage where the fix belongs.",
th:`<p><b>Chain:</b> source systems → ingestion → storage and integration → preparation and modelling → analysis and visualisation → decision → action, with outcomes feeding back as new data.</p><p><b>Lifecycle:</b> create, store, prepare, use, share, archive, delete, under governance, security (India’s DPDP Act 2023) and quality.</p><p><b>Warehouse</b>: structured and curated. <b>Lake</b>: raw and flexible.</p><p class="app"><b>In practice:</b> Starbucks links till, app and location data to store and offer decisions; Tata Steel uses sensor data to schedule maintenance; a university links ERP data to counsellor alerts.</p>`,
o:["Source systems","Ingestion","Preparation and modelling","Analysis and visualisation","Decision and action"],
qs:[["The same shopper appears with three IDs across POS, web and the loyalty app.",0,"Different systems record identity differently at the source."],["A nightly job copied the same orders twice.",1,"Duplicate loads are an ingestion fault."],["A join between orders and returns double counts sales.",2,"Wrong joins are a modelling error."],["A cluttered chart hides the trend managers need.",3,"A presentation problem."],["The dashboard is viewed daily but nobody changes anything.",4,"The metric is not tied to a decision or an owner."]]},
{n:"4 · Dashboards",ti:"Match the dashboard",pr:"Think of a dashboard you have seen (an app, a bank, a delivery tracker). Which type is it, who uses it and how often? Why is that type the right one?",how:"Choose the best dashboard type for each situation.",
th:`<table><tr><th></th><th>Audience</th><th>Rhythm</th></tr><tr><td>Strategic</td><td>CEO, board</td><td>Quarterly, 5-10 KPIs</td></tr><tr><td>Tactical</td><td>Department heads</td><td>Weekly, drill-down</td></tr><tr><td>Operational</td><td>Supervisors</td><td>Real time, alerts</td></tr><tr><td>Analytical</td><td>Analysts</td><td>On demand, explore</td></tr></table><p>Avoid one dashboard for everyone, too many KPIs, numbers without targets, and real-time data for monthly decisions.</p><p class="app"><b>In practice:</b> a bank’s executive scorecard (NIM, NPA), an FMCG regional quota view, Swiggy’s live zone map, a category manager’s margin explorer.</p>`,
o:["Strategic","Tactical","Operational","Analytical"],
qs:[["A factory screen shows machine status in red, amber and green, refreshed every minute.",2,"Live status and alerts."],["A board pack page shows seven KPIs against annual targets.",0,"Few KPIs, long horizon, senior audience."],["A finance analyst filters margin by product, customer and region to find drivers.",3,"Exploration with rich filters."],["A zonal head reviews branch results against monthly targets and drills into weak branches.",1,"Comparison with plan and drill-down."],["A call-centre supervisor must know right now if the queue is too long.",2,"Immediate action on live data."]]},
{n:"5 · Framing questions",ti:"From request to KPI",pr:"A manager asks you for “a dashboard on sales”. Write the decision behind it, one business question, and one KPI with its formula, unit and owner.",how:"A marketing head asks for “a dashboard on social media”. Work backwards from the decision.",
th:`<p><b>Chain:</b> decision → business question → metric → data requirement → visual. Start from the decision, not the data.</p><p>A KPI needs a name, formula, unit, time grain, source, owner and target. Use <b>SMART-D</b>: specific, measurable, actionable, relevant, time-bound, data-available.</p><p>Example: “why are we losing deals?” becomes win rate by segment, loss stage and reason, and at-risk deals, and exposes that loss reason must be captured in the CRM.</p><p class="app"><b>In practice:</b> store expansion, collections calling order, machine maintenance timing and student early-warning all start from a named decision.</p>`,
o:null,
qs:[["Which is a real decision?",["Build a social media dashboard","Decide by 30 November how to split ₹20 lakh of ad budget across channels","Improve engagement","Analyse our followers"],1,"It has an owner, a deadline and a choice with money attached."],["Which business question best supports that decision?",["How many followers do we have?","Which channels give the lowest cost per qualified lead?","What do customers think of us?","Is social media popular?"],1,"It is specific, measurable and changes the budget split."],["Which KPI definition is complete?",["Engagement","Likes per post","Cost per qualified lead = channel spend ÷ qualified leads, in ₹, monthly, from ad platform and CRM, owned by the Digital Marketing Manager","Follower growth"],2,"It names formula, unit, grain, source and owner."],["Which is most likely a vanity metric?",["Page views","Repeat purchase rate","Cost per qualified lead","90-day churn"],0,"It looks good but drives no decision."]]},
{n:"6 · Stakeholders",ti:"Requirements practice",pr:"A stakeholder asks you to add a new chart. Explain how you would find the decision behind the request and which MoSCoW priority you would give it, and why.",how:"Handle stakeholders and requirements as a BI analyst would.",
th:`<p><b>Stakeholders:</b> sponsor, business owner, end users, data stewards, IT, finance, compliance.</p><p><b>Power-interest grid:</b> manage sponsors and owners closely, keep finance satisfied, keep end users informed and consulted.</p><p><b>Personas:</b> Ritu (CFO, strategic), Arjun (regional manager, tactical and operational), Meera (analyst, analytical).</p><p><b>Methods:</b> interviews, workshops, shadowing, document review, data profiling, prototypes. Write user stories with acceptance criteria and rank with MoSCoW.</p><p class="app"><b>In practice:</b> a hospital group engaged compliance early because it held a veto; a university counsellor persona produced a “who to call first” view.</p>`,
o:null,
qs:[["The CFO controls budget but rarely uses the tool. Best engagement style?",["Manage closely","Keep satisfied","Keep informed and consult","Ignore"],1,"High power, low interest."],["A manager says “add a map”. Best first response?",["Add it","Ask what decision the map will support","Refuse","Ask IT"],1,"Requests hide needs; start from the decision."],["Which question best uncovers the decision behind a request?",["Which colours do you prefer?","What would you do differently with this information?","How many charts?","Which tool?"],1,"It links information to action."],["MoSCoW: “Margin must reconcile to the ledger within 0.1% or the CFO will not trust it.”",["Must","Should","Could","Won’t"],0,"The solution fails without trust."],["MoSCoW: “Alert when a store falls 20% below forecast; nice to have this release.”",["Must","Should","Could","Won’t"],2,"Valuable but optional."]]},
{n:"7 · Data to decision",sim:1,ti:"The bakery: how many cakes to bake?",sp:["Step 1 (data): What does last week's data show about daily sales?","Step 2 (information): What pattern did you find, and why does it matter to the owner?","Step 3 (decision): What quantities did you choose, why, and what was the result?"],pr:"In your own words: what pattern did the data show, what quantities did you decide to bake, and how much better was it than the gut feeling? Name one risk of relying only on past data.",how:"A small bakery must decide every day how many cakes to bake. Follow the three steps and see what changes when the decision uses data.",
th:`<p>Data is useful only when it helps someone <b>make a better decision</b>. The path is the same one you met in tab 1:</p><ul><li><b>Data</b>: what happened last week (cakes sold each day)</li><li><b>Information</b>: the pattern (weekends sell about double)</li><li><b>Decision</b>: how many to bake on each kind of day</li><li><b>Result</b>: more profit, less waste</li></ul><p><b>The case:</b> Sri Sai Bakery makes a cake for ₹60 and sells it for ₹100. A cake not sold by evening is thrown away. Bake too few and you lose sales. Bake too many and you waste money.</p><p><b>Before data:</b> the owner bakes 30 cakes every day, by gut feeling.</p><p class=\"app\"><b>In practice:</b> the same idea runs sweet shops, hotel kitchens, canteens and Swiggy Instamart dark stores: look at past sales, find the pattern, decide the quantity.</p>`},
{n:"8 · Submission",sub:1,ti:"Submission",pr:"",th:""}
];
let S={},Q={},D={wd:30,we:30},cur=0;
const NT=7;
try{const z=JSON.parse(localStorage.getItem("bidv.co1")||"{}");S=z.S||{};Q=z.Q||{};D=z.D||D;if(z.n)$("#sn").value=z.n;if(z.i)$("#si").value=z.i}catch(e){}
function save(){try{localStorage.setItem("bidv.co1",JSON.stringify({S:S,Q:Q,D:D,n:$("#sn").value,i:$("#si").value}))}catch(e){}}
const ansOf=(T,q)=>T.o?q[1]:q[2];
function tabScore(t){const T=tabs[t];if(!T.qs)return null;let c=0,n=0;T.qs.forEach((q,i)=>{if(S[t]&&i in S[t]){n++;if(S[t][i]===ansOf(T,q))c++}});return{c:c,n:n,tot:T.qs.length}}
const total=tabs.reduce((a,t)=>a+(t.qs?t.qs.length:0),0);
function score(){let c=0,n=0;tabs.forEach((T,t)=>{const r=tabScore(t);if(r){c+=r.c;n+=r.n}});$("#score").textContent="Score: "+c+" correct of "+n+" answered ("+total+" questions)"}
const words=x=>(x||"").trim().split(/\s+/).filter(Boolean).length;
function show(t){cur=t;const T=tabs[t];
document.querySelectorAll("#nav button").forEach((b,i)=>b.classList.toggle("on",i===t));
if(T.sub){report();score();return}
$("#panel").innerHTML='<div class="grid"><section class="card"><h2>Theory</h2>'+T.th+'</section><section class="card"><h2>Tutorial: '+T.ti+'</h2><p class="mut">'+T.how+'</p>'+(T.pr?'<p class="pr-p"><b>Write it up:</b> '+T.pr+'</p>':'')+'<div id="tut"></div></section></div>';
T.sim?sim():quiz(t);writeUp(t);score()}
function writeUp(t){const T=tabs[t];if(!T.pr)return;const w=document.createElement("div");
w.innerHTML='<p class="nl"><b>Write it up &middot; '+esc(T.ti)+'</b></p><textarea class="qn" placeholder="Write 2 to 4 sentences in your own words"></textarea>';
const ta=w.querySelector("textarea");ta.value=Q["w-"+t]||"";ta.oninput=()=>{Q["w-"+t]=ta.value;save()};$("#tut").appendChild(w)}

function noteBox(t,key,label,parent){const w=document.createElement("div");w.innerHTML='<p class="nl"><b>'+label+'</b></p><textarea class="qn" placeholder="Write 1 or 2 sentences"></textarea>';
const ta=w.querySelector("textarea");ta.value=Q[key]||"";ta.oninput=()=>{Q[key]=ta.value;save()};parent.appendChild(w)}
function reveal(d,t,i,j,ans,why){d.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===ans)x.classList.add("good");else if(k===j)x.classList.add("bad")});
d.querySelector(".fb").innerHTML=(j===ans?"<b>Correct.</b> ":"<b>Not quite.</b> ")+why}
function quiz(t){const T=tabs[t],box=$("#tut");
T.qs.forEach((q,i)=>{const opts=T.o||q[1],ans=ansOf(T,q),why=T.o?q[2]:q[3],text=q[0];
const d=document.createElement("div");d.className="q";d.innerHTML='<p><b>'+(i+1)+'.</b> '+text+'</p><div class="opts"></div><p class="fb"></p>';
opts.forEach((o,j)=>{const b=document.createElement("button");b.textContent=o;
b.onclick=()=>{S[t]=S[t]||{};if(i in S[t])return;S[t][i]=j;reveal(d,t,i,j,ans,why);score();save()};
d.querySelector(".opts").appendChild(b)});box.appendChild(d);noteBox(t,t+"-"+i,"What did I learn from this question?",d);
if(S[t]&&i in S[t])reveal(d,t,i,S[t][i],ans,why)});
const r=document.createElement("button");r.className="rs";r.textContent="Reset this tutorial";r.onclick=()=>{S[t]={};save();show(t)};box.appendChild(r)}
function sl(id,l,mn,mx,st,v){return '<label for="'+id+'">'+l+': <span id="v_'+id+'">'+v+'</span></label><input type="range" id="'+id+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'">'}
const f=(x,d)=>x.toLocaleString("en-IN",{maximumFractionDigits:d===undefined?2:d,minimumFractionDigits:d===undefined?2:d});
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],SOLD=[18,22,20,25,30,45,40],COST=60,PRICE=100,GUT=30;
function day(q,d){const sold=Math.min(q,d);return{sold:sold,left:q-sold,lost:d-sold,p:sold*PRICE-q*COST}}
function sim(){const wavg=(SOLD[0]+SOLD[1]+SOLD[2]+SOLD[3]+SOLD[4])/5,eavg=(SOLD[5]+SOLD[6])/2,rr=(eavg/wavg).toFixed(1);
$("#tut").innerHTML='<h3>Step 1. Look at the data</h3><p class="mut">Cakes customers wanted last week.</p><div id="d1"></div>'
+'<h3>Step 2. Find the information</h3><div class="out"><div class="k"><b>'+wavg+'</b>Weekday average (Mon-Fri)</div><div class="k"><b>'+eavg+'</b>Weekend average (Sat-Sun)</div><div class="k"><b>'+rr+'x</b>Weekend vs weekday</div></div><p class="fb">Pattern: weekends sell almost double. Baking 30 every day is too many on weekdays and too few at the weekend.</p>'
+'<h3>Step 3. Make the decision</h3><p class="mut">How many cakes will you bake?</p>'+sl("wd","Each weekday (Mon-Fri)",10,50,1,D.wd)+sl("we","Each weekend day (Sat-Sun)",10,60,1,D.we)
+'<div class="out" id="o1"></div><div id="tb"></div><p id="vb" class="fb"></p>';
document.querySelectorAll("#tut input").forEach(i=>i.oninput=calc);
const mx=Math.max(...SOLD);$("#d1").innerHTML=SOLD.map((x,i)=>'<div class="br"><span style="width:34px">'+DAYS[i]+'</span><i style="width:'+(x/mx*60)+'%"></i><span>'+x+'</span></div>').join("");tabs[6].sp.forEach((x,k)=>noteBox(6,"6-"+k,x,$("#tut")));calc()}
function calc(){document.querySelectorAll("#tut input").forEach(i=>{$("#v_"+i.id).textContent=i.value});
const wd=+$("#wd").value,we=+$("#we").value;D.wd=wd;D.we=we;save();const q=SOLD.map((_,i)=>i<5?wd:we);
const r=SOLD.map((d,i)=>day(q[i],d)),tot=r.reduce((a,x)=>a+x.p,0),gut=SOLD.reduce((a,d)=>a+day(GUT,d).p,0),best=SOLD.reduce((a,d)=>a+d*(PRICE-COST),0);
const waste=r.reduce((a,x)=>a+x.left,0),lost=r.reduce((a,x)=>a+x.lost,0);
$("#o1").innerHTML='<div class="k"><b>₹'+f(tot,0)+'</b>Your weekly profit</div><div class="k"><b>₹'+f(gut,0)+'</b>Gut feeling (30 a day)</div><div class="k"><b>'+(tot>=gut?"+":"−")+'₹'+f(Math.abs(tot-gut),0)+'</b>Gain from your decision</div>';
$("#tb").innerHTML='<table><tr><th>Day</th><th>Baked</th><th>Wanted</th><th>Wasted</th><th>Missed sales</th><th>Profit ₹</th></tr>'+r.map((x,i)=>'<tr><td>'+DAYS[i]+'</td><td>'+q[i]+'</td><td>'+SOLD[i]+'</td><td>'+x.left+'</td><td>'+x.lost+'</td><td>'+f(x.p,0)+'</td></tr>').join("")+'</table>';
$("#vb").innerHTML='<b>What this shows:</b> you wasted '+waste+' cakes and missed '+lost+' sales this week. '+(tot>gut?"Using the weekday and weekend pattern beats the gut feeling.":tot===gut?"This is the same as the gut feeling. Try different numbers for weekdays and weekends.":"This does worse than the gut feeling. Use the pattern in Step 2 to do better.")+' Even perfect baking would earn ₹'+f(best,0)+', so some gap always remains. Past data guides the decision but cannot promise the future.'}

function weekly(wd,we){return SOLD.reduce((a,d,i)=>a+day(i<5?wd:we,d).p,0)}
function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
const note=x=>x&&x.trim()?esc(x):"Not written.";
function body(nm,id){let c=0,n=0;tabs.forEach((T,t)=>{const r=tabScore(t);if(r){c+=r.c;n+=r.n}});
let h='<h2>Module 1: From Data to Decisions</h2><div class="hd"><div><b>Name:</b> '+esc(nm)+'</div><div><b>Student ID:</b> '+esc(id)+'</div><div><b>Date:</b> '+new Date().toLocaleDateString("en-IN")+'</div><div><b>Quiz score:</b> '+c+' correct of '+n+' answered ('+total+' questions)</div></div>';
for(let t=0;t<NT;t++){const T=tabs[t],r=tabScore(t);
h+='<h3>'+T.n+': '+T.ti+'</h3>';
if(r){h+='<p><b>Tutorial result:</b> '+r.c+' correct of '+r.n+' answered ('+r.tot+' questions)</p>';
if(T.pr)h+='<p><b>Write it up:</b> '+T.pr+'</p><div class="ans">'+note(Q["w-"+t])+'</div>';
T.qs.forEach((q,i)=>{const opts=T.o||q[1],ans=ansOf(T,q),why=T.o?q[2]:q[3],ch=S[t]&&i in S[t]?S[t][i]:null;
h+='<div class="qb"><p><b>Q'+(i+1)+'.</b> '+q[0]+'</p><p><b>My answer:</b> '+(ch===null?"Not answered":opts[ch]+(ch===ans?" (correct)":" (not quite; correct answer: "+opts[ans]+")"))+'</p><p><b>Explanation:</b> '+why+'</p><p><b>What I learned:</b></p><div class="ans">'+note(Q[t+"-"+i])+'</div></div>'})}
else{const wd=D.wd,we=D.we,pr=weekly(wd,we),g=weekly(GUT,GUT);h+='<p><b>My decision:</b> bake '+wd+' cakes on each weekday and '+we+' on each weekend day. <b>Weekly profit:</b> ₹'+f(pr,0)+' against ₹'+f(g,0)+' with the gut feeling of 30 a day ('+(pr>=g?"gain":"loss")+' of ₹'+f(Math.abs(pr-g),0)+').</p>';
T.sp.forEach((x,k)=>{h+='<div class="qb"><p><b>'+x+'</b></p><div class="ans">'+note(Q["6-"+k])+'</div></div>'})
if(T.pr){h+='<div class="qb"><p><b>Write it up:</b> '+T.pr+'</p><div class="ans">'+note(Q["w-"+t])+'</div></div>'}}
}
return h}
function report(){
const nm=$("#sn").value.trim(),id=$("#si").value.trim();
const miss=[];if(!nm)miss.push("your name");if(!id)miss.push("your student ID number");
let noQ=0;tabs.forEach((T,t)=>{if(t>=NT)return;(T.qs||T.sp).forEach((_,i)=>{if(words(Q[t+"-"+i])<5)noQ++});if(T.pr&&words(Q["w-"+t])<5)noQ++});
let h='<section class="card rep"><h2>Submission report</h2><div class="np">';
if(miss.length)h+='<div class="warn"><b>Before you save:</b> enter '+miss.join(" and ")+' at the top of the page.</div>';
if(noQ)h+='<div class="warn">'+noQ+' “What I learned” note(s) are empty or very short.</div>';
if(!miss.length&&!noQ)h+='<div class="okb">All parts are complete. Ready to download.</div>';
h+='<p>Download your report below. For the PDF, click <b>Save as PDF</b> and choose “Save as PDF” as the destination. Both files start with your ID. Upload the file your instructor asks for.</p><p style="display:flex;gap:10px;flex-wrap:wrap"><button class="pb" id="pdf"'+(miss.length?' disabled':'')+'>Save as PDF</button><button class="pb" id="doc"'+(miss.length?' disabled':'')+'>Download Word (.doc)</button></p></div>';
h+='<div id="rb">'+body(nm,id)+'</div></section>';
$("#panel").innerHTML=h;
const fn="BI_Module1_"+id.replace(/[^\w-]+/g,"_");
$("#pdf").onclick=()=>{const old=document.title;document.title=fn;window.onafterprint=()=>{document.title=old};window.print()};
$("#doc").onclick=()=>{const st='body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h2{color:#1F2A44}h3{color:#1F2A44;border-top:1px solid #bbb;padding-top:6pt}.ans{background:#f3efe3;padding:6pt;margin:3pt 0;white-space:pre-wrap}.qb{margin:6pt 0 10pt}';
const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+fn+'</title><style>'+st+'</style></head><body>'+body(nm,id)+'</body></html>';
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+html],{type:"application/msword"}));a.download=fn+".doc";document.body.appendChild(a);a.click();a.remove()}}
$("#nav").innerHTML=tabs.map((t,i)=>'<button>'+t.n+'</button>').join("");
document.querySelectorAll("#nav button").forEach((b,i)=>b.onclick=()=>show(i));
$("#sn").oninput=$("#si").oninput=()=>{save();if(tabs[cur].sub)report()};
show(0);
</script></body></html>
